name: 发布

# 推送 vX.Y.Z 形式的 tag 时构建六个平台的包并创建 Release。
# 也可以手动触发（Actions 页面的 Run workflow）：默认只构建、不发布，产物挂在
# 这次运行下面，用来在真正打 tag 之前验证整条流水线；勾上「发布为开发版」则把
# 产物发成滚动更新的 dev 预发布——tag 固定叫 dev（不带 v 前缀，避免触发上面的
# 正式发布），每次发布强制移动到当前提交，Release 页面上同名附件被替换。
# 刻意不做 push main 自动构建：什么时候出开发版由人决定。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "发布为开发版（滚动 dev 预发布）；不勾则只构建验证"
        type: boolean
        default: false

permissions:
  contents: write # 创建 Release 需要

jobs:
  release:
    # 全部目标都从这一台机器交叉编译：本项目没有 cgo，平台差异靠 //go:build 分文件，
    # .syso 资源文件名带 GOOS_GOARCH 后缀只在对应目标上链接。
    # 不用 windows/macos runner 还省额度（它们分别按 2 倍、10 倍计费）。
    runs-on: ubuntu-latest

    steps:
      # fetch-depth: 0 取全部历史与 tag：开发版的发布说明要靠「上一个正式 tag..HEAD」
      # 的提交范围生成，浅克隆拿不到 tag 也算不出范围。
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # 版本号的唯一来源是 internal/version，tag 与它对不上的话，
      # exe 属性里的版本会和界面显示的分叉——这种错发现得越晚越麻烦。
      - name: 核对 tag 与版本号
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          code_version=$(sed -n -E 's/^(const|var) Version = "(.*)"$/\2/p' internal/version/version.go)
          tag_version="${GITHUB_REF_NAME%%-*}"
          echo "代码里的版本: $code_version"
          echo "tag: $GITHUB_REF_NAME（比对用 $tag_version）"
          if [ "$code_version" != "$tag_version" ]; then
            echo "::error::tag 与 internal/version/version.go 不一致，请先改版本号再打 tag"
            exit 1
          fi

      - name: 检查与测试
        run: |
          go vet ./...
          go test ./...

      # 生成物（.ico 与 .syso）随库提交，这里只验证它们与当前版本号一致：
      # 重新生成后如果有 diff，说明提交时漏了 go generate 那一步。
      - name: 核对生成物
        run: |
          go generate ./cmd/wen
          if ! git diff --quiet; then
            echo "::error::生成物与版本号不一致，请在本地跑 go generate ./cmd/wen 后重新提交"
            git diff --stat
            exit 1
          fi

      - name: 构建六个平台
        env:
          CGO_ENABLED: "0"
        run: |
          # 注意：这里跑的是 bash -e，`[ 条件 ] && 赋值` 在条件不成立时会中断整个步骤，
          # 所以判断一律写成 if。
          # 开发版的包名固定用 dev、不嵌提交号：滚动预发布靠同名附件替换旧产物，
          # 名字带提交号的话旧包只会越积越多。对应哪个提交写在发布说明里。
          # 开发版把界面显示的版本号注入成 git describe 形态（v0.4.1-3-g29a95a4），
          # 让测试包自我标识而不冒充正式版；--match 'v*' 只认正式版 tag，
          # 滚动的 dev tag 不参与推算。正式发布不注入，版本号以 internal/version 为准。
          ldflags="-s -w"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="dev"
            describe=$(git describe --tags --match 'v*' 2>/dev/null || true)
            if [ -n "$describe" ]; then
              ldflags="-s -w -X wen/internal/version.Version=${describe}"
            fi
          else
            version="${GITHUB_REF_NAME}"
          fi
          mkdir -p dist
          for target in windows/amd64 windows/arm64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            goos="${target%%/*}"
            goarch="${target##*/}"
            name="wen-${version}-${goos}-${goarch}"
            work="build/${name}"
            mkdir -p "$work"

            binary="wen"
            if [ "$goos" = "windows" ]; then
              binary="wen.exe"
            fi
            echo "==> $goos/$goarch"
            GOOS="$goos" GOARCH="$goarch" go build -trimpath -ldflags "$ldflags" -o "$work/$binary" ./cmd/wen

            # 只给二进制的话，用户拿到手不知道配置从哪来
            cp config.example.yaml README.md README.en.md CHANGELOG.md LICENSE "$work/"
            # README 里的细节都在 docs/，不一并打包的话包里的链接全是死的
            cp -r docs "$work/"

            if [ "$goos" = "windows" ]; then
              (cd build && zip -qr "../dist/${name}.zip" "$name")
            else
              tar -czf "dist/${name}.tar.gz" -C build "$name"
            fi
          done
          (cd dist && sha256sum * > SHA256SUMS.txt)
          ls -lh dist

      # Release 正文取 CHANGELOG 里对应版本那一节：tag 本来就压在 CHANGELOG 提交上，
      # 不必再手写一遍发布说明。
      - name: 摘出本版本的更新日志
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          {
            awk -v ver="## [${GITHUB_REF_NAME}]" '
              index($0, ver) == 1 { found = 1; next }
              found && /^## \[/ { exit }
              found { print }
            ' CHANGELOG.md
            echo ""
            echo "---"
            echo ""
            echo "### 下载哪个"
            echo ""
            echo "| 系统 | 文件 |"
            echo "|---|---|"
            echo "| Windows | \`windows-amd64\`（Intel/AMD）、\`windows-arm64\` |"
            echo "| macOS | \`darwin-arm64\`（M 系列）、\`darwin-amd64\`（Intel） |"
            echo "| Linux | \`linux-amd64\`、\`linux-arm64\` |"
            echo ""
            echo "解压后把 \`config.example.yaml\` 复制为 \`config.yaml\`，填上 API Key 再运行。"
            echo "校验和见 \`SHA256SUMS.txt\`。"
            echo ""
            echo "macOS 与 Linux 上首次运行需要加执行权限：\`chmod +x wen\`。"
            echo "macOS 的二进制没有签名，系统会拦一次，执行 \`xattr -d com.apple.quarantine wen\` 后即可运行。"
            echo ""
            echo "### Which one to download"
            echo ""
            echo "| OS | File |"
            echo "|---|---|"
            echo "| Windows | \`windows-amd64\` (Intel/AMD), \`windows-arm64\` |"
            echo "| macOS | \`darwin-arm64\` (Apple silicon), \`darwin-amd64\` (Intel) |"
            echo "| Linux | \`linux-amd64\`, \`linux-arm64\` |"
            echo ""
            echo "Unpack it, copy \`config.example.yaml\` to \`config.yaml\`, fill in your API key and run it."
            echo "Checksums are in \`SHA256SUMS.txt\`."
            echo ""
            echo "On macOS and Linux the binary needs the executable bit the first time: \`chmod +x wen\`."
            echo "The macOS binary is unsigned, so the system blocks it once; run \`xattr -d com.apple.quarantine wen\` and it will start."
          } > release-notes.md
          cat release-notes.md

      - name: 创建 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          files: dist/*
          # 带后缀的 tag（如 v0.1.3-rc1）标记为预发布
          prerelease: ${{ contains(github.ref_name, '-') }}

      # ---------- 手动触发：开发版预发布 ----------

      # 开发版的说明从「上一个正式 tag..HEAD」的提交直接生成。正式版的 CHANGELOG
      # 要求把提交改写成使用者的语言，开发版不做这道工序：它面向的是想尝鲜或帮忙
      # 验证的人，原始提交列表就是他们要的信息，且每次构建都重新生成、无人维护。
      - name: 生成开发版发布说明
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        run: |
          last_tag=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          {
            echo "开发版构建，对应提交 \`${GITHUB_SHA::7}\`，构建于 $(date -u +'%Y-%m-%d %H:%M') UTC。"
            echo "程序界面与 \`wen version\` 显示形如 \`v0.4.1-3-g29a95a4\` 的开发版号"
            echo "（上一个正式版-之后的提交数-g提交号）；Windows exe 文件属性里仍是"
            echo "上一个正式版${last_tag:+（$last_tag）}的版本资源，属正常现象。"
            echo ""
            echo "A development build of commit \`${GITHUB_SHA::7}\`. The program and \`wen version\` report a"
            echo "version like \`v0.4.1-3-g29a95a4\` (last stable release, commits since, commit hash);"
            echo "the Windows exe still carries the version resource of the last stable release, which is expected."
            echo "The change list below is the raw commit subjects, which are written in Chinese."
            echo ""
            if [ -n "$last_tag" ]; then
              echo "### 自 $last_tag 以来的改动（提交原文） / Changes since $last_tag (raw commit subjects)"
            else
              echo "### 包含的提交 / Commits included"
            fi
            echo ""
            git log --no-merges --pretty='- %s' ${last_tag:+$last_tag..}HEAD
            echo ""
            echo "---"
            echo ""
            echo "下载与运行方式同正式版：解压后把 \`config.example.yaml\` 复制为 \`config.yaml\`，"
            echo "填上 API Key 再运行；校验和见 \`SHA256SUMS.txt\`。"
            echo "macOS 与 Linux 首次运行需要 \`chmod +x wen\`；macOS 还需"
            echo "\`xattr -d com.apple.quarantine wen\` 解除隔离。"
            echo ""
            echo "Download and run it the same way as a stable release: unpack it, copy \`config.example.yaml\`"
            echo "to \`config.yaml\`, fill in your API key and run it; checksums are in \`SHA256SUMS.txt\`."
            echo "On macOS and Linux the binary needs \`chmod +x wen\` the first time; on macOS also run"
            echo "\`xattr -d com.apple.quarantine wen\` to clear the quarantine flag."
          } > release-notes.md
          cat release-notes.md

      # 滚动 tag 每次强制移动到当前提交，Release 页面「对应源码」才不会指着旧代码。
      # tag 名不带 v 前缀，推它不会触发本 workflow 的正式发布分支。
      - name: 移动滚动 dev tag
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        run: |
          git tag -f dev
          git push -f origin dev

      - name: 创建或更新开发版预发布
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: dev
          # 标题用英文：Release 页面是项目对外的一面，而这一条又是滚动的、
          # 位置还不在最上面（tag 挪位置不会让 GitHub 重排），标题得自己说清它是什么。
          name: Development build (rolling)
          body_path: release-notes.md
          files: dist/*
          prerelease: true

      - name: 只构建不发布时把产物挂在这次运行下
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish }}
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
