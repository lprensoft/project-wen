# Wen Agent 配置示例
# 复制为 config.yaml 后按需修改（config.yaml 已在 .gitignore 中，不会提交入库）。
# 加载优先级：CLI flag > config.yaml > 内置默认值

server:
  host: 127.0.0.1
  port: 8080

# 当前使用的模型（provider 名 + 模型 id）。
# 这里是初始值：设置页「模型」栏目的改动写入 <配置目录>/models.json 并优先生效，
# 不会回写本文件；未在界面上改过的条目仍跟随这里。
model:
  provider: deepseek
  name: deepseek-chat
  temperature: 0.7           # 思考模式开启时不生效
  max_tokens: 4096
  thinking: high             # 思考模式：off / low / medium / high / xhigh / max（默认 high）
  context_length: 1000000    # 模型上下文窗口（token），超出时自动裁剪最旧对话轮次

# Provider 注册表 —— 后续接入 OpenAI / Ollama 等只需在此加条目
providers:
  deepseek:
    type: openai_compat      # openai_compat / anthropic
    base_url: https://api.deepseek.com
    api_key: sk-你的密钥       # 直接填写；也支持 ${VAR} 从进程环境变量读取
                             # 注意：${VAR} 展开后的值若被界面保存进 models.json 就会固定下来
  # anthropic:
  #   type: anthropic
  #   base_url: https://api.anthropic.com
  #   api_key: sk-ant-你的密钥

agent:
  system_prompt: ""          # 系统提示词，先留空
  max_turns: 20              # 单次用户请求内工具循环上限
  workdir: ""                # 工作目录（插件与环境块共用），空 = 进程当前目录

# 系统插件：enabled 与 config 为初始值；运行时的开关（/plugins 或 API）与在
# 设置页里改过的插件配置持久化在 <配置目录>/plugins.state.json，
# 优先于这里的初始值，不会回写本文件。
# 插件自身的数据落在 <配置目录>/plugins/<插件名>/（已在 .gitignore 中）。
plugins:
  read_file:
    enabled: true
    config: {}               # 可选 max_bytes，默认 65536
  exec_command:
    enabled: true
    config:
      timeout_seconds: 60
  web_fetch:
    enabled: true
    config:
      timeout_seconds: 20
      max_bytes: 65536
  # 长期记忆
  memory:
    enabled: true
    config:
      scope: global            # global = <配置目录>/plugins/memory/memories/（所有工作目录共享）
                               # project = <工作目录>/.wen/memories/（按项目分库，建议加进项目的 .gitignore）
                               # 切换后原位置的记忆不会自动迁移
      max_index_entries: 200   # 索引最多列出条数
      max_index_bytes: 16384   # 索引字节上限（约 170 条带摘要；实测一条约 31 token）
                               # 注意：索引在每一轮对话中都会重复发送，且计入自动压缩的判据
      max_entry_bytes: 8192    # 读取单条记忆的返回上限
      auto_extract: true       # 压缩前自动从历史里提炼长期记忆（每次压缩多一次模型调用）
      max_extract: 5           # 单次压缩最多提炼条数
  # 历史检索：回查原始对话，范围含现存会话与压缩前的完整归档
  session_search:
    enabled: true
    config:
      max_scan_sessions: 300   # 单次最多读取的会话数（按时间从新到旧，超出会在结果里注明）
      max_snippets: 3          # 每个会话最多返回的摘录数
      max_bytes: 8192          # 单次返回上限
      max_archives: 20         # 保留的压缩归档数，0 = 不归档（被压缩过的会话将只剩摘要可查）

session:
  dir: ""                    # session 存储目录，空 = <配置目录>/sessions
