<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wen Agent</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <script>
    // 与主界面同一套主题标记与语言判定。这一页刻意不引用 style.css 与 i18n.js：
    // 认证中间件只放行登录页本身，放开整个静态目录会把未登录能看到的东西变多，
    // 而这里只有四句话，为它多放行一个文件不划算。判定规则与 i18n.js 一致：
    // localStorage 的三态（auto / zh / en）优先，auto 时按 navigator.languages 逐个认。
    (function () {
      var s = localStorage.getItem("wen-theme") || "system";
      var dark = s === "dark" || (s === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.dataset.theme = dark ? "dark" : "light";

      var saved = localStorage.getItem("wen-lang");
      var lang = saved === "zh" || saved === "en" ? saved : detect();
      function detect() {
        var list = (navigator.languages && navigator.languages.length)
          ? navigator.languages : [navigator.language || ""];
        for (var i = 0; i < list.length; i++) {
          var c = String(list[i]).toLowerCase();
          if (c === "zh" || c.indexOf("zh-") === 0) return "zh";
          if (c === "en" || c.indexOf("en-") === 0) return "en";
        }
        return "en";
      }
      window.WEN_TEXT = lang === "en" ? {
        title: "Sign in · Wen Agent",
        sub: "Enter the access password",
        label: "Access password",
        submit: "Sign in",
        failed: "Sign-in failed",
        offline: "Can't reach the service",
      } : {
        title: "登录 · Wen Agent",
        sub: "请输入访问口令",
        label: "访问口令",
        submit: "登录",
        failed: "登录失败",
        offline: "无法连接服务",
      };
      document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
      document.title = window.WEN_TEXT.title;
    })();
  </script>
  <style>
    :root {
      --bg: #f5f6f8; --panel: #ffffff; --border: #e2e4e8;
      --text: #1f2328; --text-dim: #6b7280;
      --accent: #2563eb; --accent-hover: #1d4ed8;
      --danger: #dc2626; --danger-bg: #fee2e2;
    }
    :root[data-theme="dark"] {
      --bg: #12151a; --panel: #1a1f26; --border: #2b323c;
      --text: #e5e7eb; --text-dim: #98a2b0;
      --accent: #3b82f6; --accent-hover: #2563eb;
      --danger: #f87171; --danger-bg: #3d1f1f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex;
      align-items: center; justify-content: center;
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    .card {
      width: min(360px, calc(100vw - 32px));
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 12px; padding: 28px 26px;
    }
    .logo { display: block; width: 56px; height: 56px; margin: 0 auto 14px; border-radius: 12px; }
    h1 { margin: 0 0 4px; font-size: 17px; text-align: center; font-weight: 600; }
    .sub { margin: 0 0 20px; font-size: 12.5px; color: var(--text-dim); text-align: center; }
    label { display: block; font-size: 12.5px; color: var(--text-dim); margin-bottom: 6px; }
    input {
      width: 100%; padding: 9px 11px; font-size: 14px;
      background: var(--bg); color: var(--text);
      border: 1px solid var(--border); border-radius: 7px; outline: none;
    }
    input:focus { border-color: var(--accent); }
    button {
      width: 100%; margin-top: 16px; padding: 9px; font-size: 14px; font-weight: 500;
      background: var(--accent); color: #fff; border: 0; border-radius: 7px; cursor: pointer;
    }
    button:hover:not(:disabled) { background: var(--accent-hover); }
    button:disabled { opacity: .6; cursor: default; }
    .err {
      margin-top: 14px; padding: 8px 11px; font-size: 12.5px;
      background: var(--danger-bg); color: var(--danger); border-radius: 7px;
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <form class="card" id="form">
    <img class="logo" src="assets/logo-512.png" alt="">
    <h1>Wen Agent</h1>
    <p class="sub" id="sub"></p>
    <label for="pwd" id="pwd-label"></label>
    <input id="pwd" type="password" autocomplete="current-password" autofocus>
    <button id="submit" type="submit"></button>
    <div id="err" class="err hidden"></div>
  </form>
  <script>
    const form = document.getElementById("form");
    const pwd = document.getElementById("pwd");
    const submit = document.getElementById("submit");
    const err = document.getElementById("err");

    // 文案在首屏前就由 <head> 里的脚本定好，这里只是填进去
    document.getElementById("sub").textContent = WEN_TEXT.sub;
    document.getElementById("pwd-label").textContent = WEN_TEXT.label;
    submit.textContent = WEN_TEXT.submit;

    function fail(msg) {
      err.textContent = msg;
      err.classList.remove("hidden");
      pwd.select();
    }

    // 已经登录（或本机免认证）时不该停在登录页
    fetch("/api/auth/status").then(r => r.json()).then(s => {
      if (s.authenticated) location.replace("/");
    }).catch(() => {});

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      err.classList.add("hidden");
      submit.disabled = true;
      try {
        const res = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password: pwd.value }),
        });
        if (res.ok) { location.replace("/"); return; }
        const body = await res.json().catch(() => ({}));
        fail(body.error || WEN_TEXT.failed);
      } catch {
        fail(WEN_TEXT.offline);
      } finally {
        submit.disabled = false;
      }
    });
  </script>
</body>
</html>
