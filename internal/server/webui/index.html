<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wen Agent</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="assets/logo-512.png" sizes="512x512">
  <link rel="apple-touch-icon" href="assets/logo-512.png">
  <script>
    // 首屏前确定主题与聊天栏宽度，避免闪白/闪黑与布局跳动。
    // 两者都只写标记，具体取值在 style.css 里，这里不重复任何数值。
    (function () {
      var s = localStorage.getItem("wen-theme") || "system";
      var dark = s === "dark" || (s === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.dataset.theme = dark ? "dark" : "light";
      document.documentElement.dataset.chatWidth = localStorage.getItem("wen-chat-width") || "medium";
    })();
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-header">
        <span class="logo" role="img" aria-label="Wen Agent"></span>
        <div class="header-actions">
          <button id="btn-new" class="btn-primary" title="新建会话">＋ 新会话</button>
        </div>
      </div>
      <ul id="session-list" class="session-list"></ul>
      <div class="sidebar-footer">
        <div class="footer-left">
          <button id="btn-settings" class="btn-icon btn-square" title="设置">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          </button>
          <span id="version-label" class="version-label"></span>
        </div>
        <div id="theme-seg" class="theme-seg" title="界面风格">
          <span class="theme-seg-thumb"></span>
          <button class="theme-seg-btn" data-theme-opt="system" title="跟随系统">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
          </button>
          <button class="theme-seg-btn" data-theme-opt="light" title="浅色">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          </button>
          <button class="theme-seg-btn" data-theme-opt="dark" title="深色">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </button>
        </div>
      </div>
    </aside>

    <main class="chat">
      <div id="messages" class="messages">
        <div class="empty-hint" id="empty-hint">新建或选择一个会话开始对话</div>
      </div>
      <form id="chat-form" class="composer">
        <div class="composer-box">
          <div id="cmd-menu" class="cmd-menu hidden"></div>
          <textarea id="input" rows="1" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
          <div class="composer-bar">
            <div class="composer-anchor">
              <button type="button" id="btn-filter" class="chip" title="选择聊天区显示哪些内容">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18"/><path d="M7 12h10"/><path d="M11 19h2"/></svg>
                <span>显示内容</span>
              </button>
              <div id="filter-menu" class="popup-menu hidden"></div>
            </div>
            <div class="composer-anchor anchor-right">
              <button type="button" id="btn-model" class="chip" title="切换当前使用的模型">
                <span id="model-label">—</span>
                <svg class="chip-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
              </button>
              <div id="model-menu" class="popup-menu align-right hidden"></div>
            </div>
            <button type="submit" id="btn-send" class="btn-send" title="发送" aria-label="发送">
              <svg class="icon-send" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>
              <svg class="icon-stop" viewBox="0 0 24 24" fill="currentColor" stroke="none"><rect x="7" y="7" width="10" height="10" rx="1.5"/></svg>
            </button>
          </div>
        </div>
      </form>
    </main>
  </div>

  <div id="settings-view" class="settings-view hidden">
    <div class="settings-header">
      <button id="btn-settings-back" class="btn-icon btn-square" title="返回">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
      </button>
      <span class="settings-title">设置</span>
    </div>
    <div class="settings-main">
      <nav class="settings-nav" id="settings-nav">
        <button class="settings-nav-item active" data-section="general">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
          <span>通用</span>
        </button>
        <button class="settings-nav-item" data-section="plugins">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h3a3 3 0 0 0 6 0h3a2 2 0 0 1 2 2v3a3 3 0 0 0 0 6v3a2 2 0 0 1-2 2h-3a3 3 0 0 1-6 0H6a2 2 0 0 1-2-2v-3a3 3 0 0 1 0-6V6a2 2 0 0 1 2-2z"/></svg>
          <span>插件</span>
        </button>
        <button class="settings-nav-item" data-section="models">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><line x1="9" y1="1" x2="9" y2="4"/><line x1="15" y1="1" x2="15" y2="4"/><line x1="9" y1="20" x2="9" y2="23"/><line x1="15" y1="20" x2="15" y2="23"/><line x1="20" y1="9" x2="23" y2="9"/><line x1="20" y1="14" x2="23" y2="14"/><line x1="1" y1="9" x2="4" y2="9"/><line x1="1" y1="14" x2="4" y2="14"/></svg>
          <span>模型</span>
        </button>
      </nav>
      <div class="settings-content">
        <section class="settings-section" id="section-general">
          <h3>通用</h3>
          <p class="settings-desc">界面外观设定，只影响本机的浏览器显示，不写入服务端配置。</p>
          <div class="field">
            <span class="field-label">聊天栏宽度</span>
            <span class="field-desc" id="chat-width-desc"></span>
            <div class="seg-group" id="chat-width-seg">
              <button type="button" class="seg-btn" data-width="narrow">窄</button>
              <button type="button" class="seg-btn" data-width="medium">中</button>
              <button type="button" class="seg-btn" data-width="wide">宽</button>
            </div>
          </div>
        </section>
        <section class="settings-section hidden" id="section-plugins">
          <h3>插件</h3>
          <p class="settings-desc">开关立即生效并持久化，作用于下一次对话请求。</p>
          <div id="settings-plugins"></div>
        </section>
        <section class="settings-section hidden" id="section-models">
          <h3>模型</h3>
          <p class="settings-desc">改动写入 &lt;配置目录&gt;/models.json，保存后下一次对话请求即生效。</p>
          <div id="models-error" class="modal-error hidden"></div>
          <div class="models-toolbar">
            <span id="models-current" class="models-current"></span>
            <button id="btn-add-provider" class="btn-primary" type="button">＋ 新增提供商</button>
          </div>
          <div id="settings-models" class="provider-list"></div>
        </section>
      </div>
    </div>
  </div>

  <div id="plugin-config-modal" class="modal-overlay hidden">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="plugin-config-title">
      <div class="modal-head">
        <span class="modal-title" id="plugin-config-title">插件配置</span>
        <button id="btn-config-close" class="btn-icon btn-square" type="button" title="关闭">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <form id="plugin-config-form" class="modal-body"></form>
      <div id="plugin-config-error" class="modal-error hidden"></div>
      <div class="modal-foot">
        <button id="btn-config-reset" class="btn-ghost" type="button">恢复默认</button>
        <span class="modal-foot-gap"></span>
        <button id="btn-config-cancel" class="btn-ghost" type="button">取消</button>
        <button id="btn-config-save" class="btn-primary" type="button">保存</button>
      </div>
    </div>
  </div>

  <div id="plugin-action-modal" class="modal-overlay hidden">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="plugin-action-title">
      <div class="modal-head">
        <span class="modal-title" id="plugin-action-title">插件操作</span>
        <button id="btn-action-close" class="btn-icon btn-square" type="button" title="关闭">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body plugin-action-body">
        <img id="plugin-action-image" class="plugin-action-image hidden" alt="" />
        <div id="plugin-action-message" class="plugin-action-message"></div>
      </div>
      <div class="modal-foot">
        <span class="modal-foot-gap"></span>
        <button id="btn-action-dismiss" class="btn-ghost" type="button">关闭</button>
      </div>
    </div>
  </div>

  <div id="provider-modal" class="modal-overlay hidden">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="provider-modal-title">
      <div class="modal-head">
        <span class="modal-title" id="provider-modal-title">提供商</span>
        <button id="btn-provider-close" class="btn-icon btn-square" type="button" title="关闭">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <form id="provider-form" class="modal-body"></form>
      <div id="provider-error" class="modal-error hidden"></div>
      <div class="modal-foot">
        <button id="btn-provider-test" class="btn-ghost" type="button">测试连接</button>
        <span class="modal-foot-gap"></span>
        <button id="btn-provider-cancel" class="btn-ghost" type="button">取消</button>
        <button id="btn-provider-save" class="btn-primary" type="button">保存</button>
      </div>
    </div>
  </div>

  <div id="model-modal" class="modal-overlay hidden">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="model-modal-title">
      <div class="modal-head">
        <span class="modal-title" id="model-modal-title">模型</span>
        <button id="btn-model-close" class="btn-icon btn-square" type="button" title="关闭">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <form id="model-form" class="modal-body"></form>
      <div id="model-error" class="modal-error hidden"></div>
      <div class="modal-foot">
        <span class="modal-foot-gap"></span>
        <button id="btn-model-cancel" class="btn-ghost" type="button">取消</button>
        <button id="btn-model-save" class="btn-primary" type="button">保存</button>
      </div>
    </div>
  </div>

  <script src="vendor/marked.min.js"></script>
  <script src="vendor/purify.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
