<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wen Agent</title>
  <script>
    // 首屏前确定主题，避免闪白/闪黑
    (function () {
      var s = localStorage.getItem("wen-theme") || "system";
      var dark = s === "dark" || (s === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.dataset.theme = dark ? "dark" : "light";
    })();
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-header">
        <span class="logo">Wen Agent</span>
        <div class="header-actions">
          <button id="btn-new" class="btn-primary" title="新建会话">＋ 新会话</button>
        </div>
      </div>
      <ul id="session-list" class="session-list"></ul>
      <div class="sidebar-footer">
        <button id="btn-settings" class="btn-icon btn-square" title="设置">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
        <div id="theme-seg" class="theme-seg" title="界面风格">
          <span class="theme-seg-thumb"></span>
          <button class="theme-seg-btn" data-theme-opt="system" title="跟随系统">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
          </button>
          <button class="theme-seg-btn" data-theme-opt="light" title="浅色">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          </button>
          <button class="theme-seg-btn" data-theme-opt="dark" title="深色">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </button>
        </div>
      </div>
    </aside>

    <main class="chat">
      <div id="messages" class="messages">
        <div class="empty-hint" id="empty-hint">新建或选择一个会话开始对话</div>
      </div>
      <form id="chat-form" class="composer">
        <div id="cmd-menu" class="cmd-menu hidden"></div>
        <textarea id="input" rows="1" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
        <button type="submit" id="btn-send" class="btn-primary">发送</button>
      </form>
    </main>
  </div>

  <div id="settings-view" class="settings-view hidden">
    <div class="settings-header">
      <button id="btn-settings-back" class="btn-icon btn-square" title="返回">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
      </button>
      <span class="settings-title">设置</span>
    </div>
    <div class="settings-main">
      <nav class="settings-nav" id="settings-nav">
        <button class="settings-nav-item active" data-section="plugins">插件</button>
        <button class="settings-nav-item" data-section="models">模型</button>
      </nav>
      <div class="settings-content">
        <section class="settings-section" id="section-plugins">
          <h3>插件</h3>
          <p class="settings-desc">开关立即生效并持久化，作用于下一次对话请求。</p>
          <div id="settings-plugins" class="plugin-grid"></div>
        </section>
        <section class="settings-section hidden" id="section-models">
          <h3>模型</h3>
          <p class="settings-desc">改动写入 &lt;配置目录&gt;/models.json，保存后下一次对话请求即生效。</p>
          <div id="models-error" class="modal-error hidden"></div>
          <div class="models-toolbar">
            <span id="models-current" class="models-current"></span>
            <button id="btn-add-provider" class="btn-primary" type="button">＋ 新增提供商</button>
          </div>
          <div id="settings-models" class="provider-list"></div>
        </section>
      </div>
    </div>
  </div>

  <div id="plugin-config-modal" class="modal-overlay hidden">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="plugin-config-title">
      <div class="modal-head">
        <span class="modal-title" id="plugin-config-title">插件配置</span>
        <button id="btn-config-close" class="btn-icon btn-square" type="button" title="关闭">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <form id="plugin-config-form" class="modal-body"></form>
      <div id="plugin-config-error" class="modal-error hidden"></div>
      <div class="modal-foot">
        <button id="btn-config-reset" class="btn-ghost" type="button">恢复默认</button>
        <span class="modal-foot-gap"></span>
        <button id="btn-config-cancel" class="btn-ghost" type="button">取消</button>
        <button id="btn-config-save" class="btn-primary" type="button">保存</button>
      </div>
    </div>
  </div>

  <div id="provider-modal" class="modal-overlay hidden">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="provider-modal-title">
      <div class="modal-head">
        <span class="modal-title" id="provider-modal-title">提供商</span>
        <button id="btn-provider-close" class="btn-icon btn-square" type="button" title="关闭">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <form id="provider-form" class="modal-body"></form>
      <div id="provider-error" class="modal-error hidden"></div>
      <div class="modal-foot">
        <button id="btn-provider-test" class="btn-ghost" type="button">测试连接</button>
        <span class="modal-foot-gap"></span>
        <button id="btn-provider-cancel" class="btn-ghost" type="button">取消</button>
        <button id="btn-provider-save" class="btn-primary" type="button">保存</button>
      </div>
    </div>
  </div>

  <div id="model-modal" class="modal-overlay hidden">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="model-modal-title">
      <div class="modal-head">
        <span class="modal-title" id="model-modal-title">模型</span>
        <button id="btn-model-close" class="btn-icon btn-square" type="button" title="关闭">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <form id="model-form" class="modal-body"></form>
      <div id="model-error" class="modal-error hidden"></div>
      <div class="modal-foot">
        <span class="modal-foot-gap"></span>
        <button id="btn-model-cancel" class="btn-ghost" type="button">取消</button>
        <button id="btn-model-save" class="btn-primary" type="button">保存</button>
      </div>
    </div>
  </div>

  <script src="vendor/marked.min.js"></script>
  <script src="vendor/purify.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
